name: Z.ai Agent 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Create workspace dirs
        run: mkdir -p workspace data

      - name: Restore workspace artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: agent-workspace-v17
          path: workspace/

      - name: Run Agent v17.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          ALLOWED_USERNAMES: ${{ secrets.ALLOWED_USERNAMES }}
          DEFAULT_MODEL: ${{ secrets.DEFAULT_MODEL || 'glm-4-flash' }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_BASE_URL: ${{ secrets.ZAI_BASE_URL }}
          ZAI_CHAT_ID: ${{ secrets.ZAI_CHAT_ID }}
          ZAI_USER_ID: ${{ secrets.ZAI_USER_ID }}
          ZAI_TOKEN: ${{ secrets.ZAI_TOKEN }}
        run: npx tsx src/index.ts

      - name: Save workspace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-workspace-v17
          path: workspace/
          retention-days: 90
